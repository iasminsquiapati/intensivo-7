<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03 - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <main class="login">
 
        <h1>Login</h1>
 
        <form id="formLogin">
 
            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >
 
            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >
 
            <button type="submit">Entrar</button>
 
        </form>
 
        <p id="mensagem"></p>
 
    </main>
 
    <script src="script.js"></script>
</body>
</html>
